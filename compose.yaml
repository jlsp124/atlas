services:
  atlas:
    image: atlas:${ATLAS_IMAGE_TAG:-local}
    build: .
    init: true
    restart: unless-stopped
    env_file: .env.server
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DATA_DIR: /app/data
      NODE_ENV: production
      ATLAS_DEPLOY_SHA: ${ATLAS_DEPLOY_SHA:-unknown}
    ports:
      - '127.0.0.1:8787:8787'
    volumes:
      - atlas-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '3'
volumes:
  atlas-data:
